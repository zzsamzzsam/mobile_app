pluginManagement {
    includeBuild("../node_modules/@react-native/gradle-plugin")
    def expoPluginsPath = new File(
        ["node", "--print", "require.resolve('expo-modules-autolinking/package.json')"]
            .execute(null, rootDir)
            .text
            .trim(),
        "../android/expo-gradle-plugin"
    ).absolutePath

    includeBuild(expoPluginsPath)
}

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
}

expoAutolinking.useExpoModules()

rootProject.name = 'tpasc'

include ':app'

includeBuild("../node_modules/@react-native/gradle-plugin")

include ':react-native-vector-icons'

project(':react-native-vector-icons').projectDir = new File(
    rootProject.projectDir,
    '../node_modules/react-native-vector-icons/android'
)

include ':react-native-code-push'

project(':react-native-code-push').projectDir = new File(
    rootProject.projectDir,
    '../node_modules/react-native-code-push/android/app'
)